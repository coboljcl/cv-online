<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-label="Hero placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a323f"/>
      <stop offset="1" stop-color="#1a1f27"/>
    </linearGradient>
    <linearGradient id="profile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c3b0"/>
      <stop offset="1" stop-color="#bfa692"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262e"/>
      <stop offset="1" stop-color="#161a20"/>
    </linearGradient>
  </defs>
  <rect width="520" height="560" fill="url(#bg)"/>

  <!-- orange corner blocks -->
  <rect x="-40" y="450" width="200" height="180" fill="#f7a427" opacity="0.9"/>
  <polygon points="420,560 540,560 540,420" fill="#f7a427"/>

  <!-- blue diagonal band -->
  <polygon points="180,560 420,560 520,360 520,300" fill="#1f7ae0" opacity="0.85"/>

  <!-- profile figure -->
  <g transform="translate(260 40)">
    <!-- neck -->
    <rect x="-12" y="300" width="24" height="60" rx="10" fill="#c4ab96"/>
    <!-- head -->
    <ellipse cx="0" cy="250" rx="66" ry="76" fill="url(#profile)"/>
    <!-- hair -->
    <path d="M-66 260 C-70 170 -40 140 0 140 C40 140 70 170 66 260 C66 220 40 196 0 196 C-40 196 -66 220 -66 260 Z" fill="url(#hair)"/>
    <path d="M-66 260 C-68 200 -48 150 0 148 C-20 150 -60 200 -66 260 Z" fill="url(#hair)"/>
    <!-- shoulders (white coat) -->
    <path d="M-120 460 C-120 380 -60 350 0 350 C60 350 120 380 120 460 Z" fill="#f5f7fa"/>
    <path d="M-120 460 L-60 350 C-40 340 -20 336 0 336 L0 460 Z" fill="#e8edf3"/>
    <path d="M120 460 L60 350 C40 340 20 336 0 336 L0 460 Z" fill="#e8edf3"/>
    <!-- collar -->
    <path d="M-20 340 L0 372 L20 340" fill="none" stroke="#cdd6e0" stroke-width="2"/>
  </g>

  <!-- floating medical cross (code bracket motif) -->
  <g transform="translate(40 120)" stroke="#1f7ae0" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M10 0 L0 0 L0 20"/>
    <path d="M10 40 L0 40 L0 20"/>
  </g>
</svg>
